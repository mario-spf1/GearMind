# ============================================================
#  Reglas ProGuard para GearMind
#  Solo se ofusca el JAR de GearMind; las dependencias en lib/
#  se quedan como estan (no son nuestras y romperian la app).
# ============================================================

# (No usamos -target: ProGuard lo deduce y desde class file 56
#  (Java 12+) la opcion esta deprecada.)

# Stack traces utiles si el cliente reporta un error
-keepattributes SourceFile,LineNumberTable,*Annotation*,Signature,InnerClasses,EnclosingMethod,Exceptions

# No optimizar ni eliminar codigo: solo renombrar.
# Optimizar/shrinkear puede romper cosas que se cargan por reflexion sin que ProGuard se entere. Coste: jar algo mas grande.
-dontshrink
-dontoptimize

# ----- Entry points (clases con main / arrancadas por scripts) -----
-keep public class com.gearmind.presentation.App {
    public static void main(java.lang.String[]);
}
-keep public class com.gearmind.launcher.LauncherApp {
    public static void main(java.lang.String[]);
}
-keep public class com.gearmind.infrastructure.database.DatabaseSetupMain {
    public static void main(java.lang.String[]);
}
-keep public class com.gearmind.infrastructure.database.FirstSetupMain {
    public static void main(java.lang.String[]);
}
-keep public class com.gearmind.infrastructure.telegram.TelegramWebhookMain {
    public static void main(java.lang.String[]);
}

# JavaFX instancia las Application por reflexion
-keep class * extends javafx.application.Application { *; }

# ----- Controladores FXML -----
# Los .fxml referencian fx:controller="com.gearmind...Controller" por nombre, # y los @FXML fields / onAction="#metodo" se resuelven por reflexion.
# Mantenemos clase + miembros publicos/privados de todos los controladores.
-keep class com.gearmind.presentation.controller.** { *; }
-keep class com.gearmind.launcher.LauncherController { *; }

# ----- DTOs Jackson (Telegram webhook) -----
# Jackson lee/escribe JSON mapeando por nombres de campo.
-keep class com.gearmind.infrastructure.telegram.dto.** { *; }

# ----- Enums -----
# JDBC y otros usan Enum.valueOf(String) por nombre.
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# ----- Silenciar warnings/notes ruidosos -----
# - dontwarn: warnings de librerias externas con clases opcionales
# - ignorewarnings: no abortar por warnings
# - dontnote: notas como "duplicate library class" (jmods solapan
#   module-info) y "keeps entry point X but not descriptor class Y"
#   (los descriptors se renombran consistentemente, no hay problema)
-dontwarn **
-ignorewarnings
-dontnote **
